name: Release APK

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm install

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/app/ainews.keystore

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > mobile/android/app/google-services.json

      - name: Write gradle.properties signing config
        run: |
          echo "AINEWS_KEYSTORE_FILE=ainews.keystore" >> mobile/android/gradle.properties
          echo "AINEWS_KEY_ALIAS=ainews" >> mobile/android/gradle.properties
          echo "AINEWS_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}" >> mobile/android/gradle.properties
          echo "AINEWS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> mobile/android/gradle.properties

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Get version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d-%H%M')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "AI News ${{ steps.version.outputs.version }}"
          body: "Mise à jour automatique — ${{ steps.version.outputs.version }}"
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
